spring.application.name=D1W17

# credenziali in env.properties (non va su git)
# il secondo percorso serve quando l'app parte dalla root del progetto (es. VS Code)
spring.config.import=optional:file:./env.properties,optional:file:./backend/env.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/banca
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# email (gmail con password per le app)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# usato per costruire il link di conferma
app.url=http://localhost:8080
